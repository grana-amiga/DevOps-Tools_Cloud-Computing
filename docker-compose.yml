# Nome fixo do projeto: volume e rede viram granaamiga_* em qualquer pasta/máquina
name: granaamiga

services:

  db:
    container_name: db
    # Oracle Database 23ai Free (imagem gvenzl, a mais usada para Oracle em container).
    # "slim" = sem componentes opcionais, imagem menor. Versão fixada (23.26.3), nada de "latest".
    image: gvenzl/oracle-free:23.26.3-slim
    expose:
      - "1521" # Sem "ports": o banco só é acessível por containers na mesma rede
    networks:
      - granaamiga-network
    volumes:
      # Volume nomeado: arquivos de dados do Oracle sobrevivem a "docker compose down"
      - oracle-data:/opt/oracle/oradata
      # Scripts de inicialização (rodam só na primeira subida, com o volume vazio)
      - ./db/init:/container-entrypoint-initdb.d:ro
      - ./db/GranaAmiga_GS2026_2_BD.sql:/opt/granaamiga/GranaAmiga_GS2026_2_BD.sql:ro
      - ./db/healthcheck.sql:/opt/granaamiga/healthcheck.sql:ro
    restart: unless-stopped
    # Valores lidos do .env (o Compose carrega o .env da pasta automaticamente)
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD}       # senha dos usuários administrativos (SYS/SYSTEM)
      APP_USER: ${APP_USER}                     # schema da aplicação, criado no FREEPDB1
      APP_USER_PASSWORD: ${APP_USER_PASSWORD}
    healthcheck:
      # Só fica "healthy" depois que o script do Davi criou tabelas, dados e procedures
      test: ["CMD-SHELL", "sqlplus -s -L $${APP_USER}/$${APP_USER_PASSWORD}@//localhost/FREEPDB1 @/opt/granaamiga/healthcheck.sql | grep -q PRONTO"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s # Oracle demora ~1 min para subir; falhas nesse período não contam

  app:
    container_name: app
    build:
      context: ./app
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT:-8080}:8080"
    networks:
      - granaamiga-network
    environment:
      # "db" é o nome do serviço acima: o DNS interno da rede do Compose resolve para o container do banco
      DB_URL: jdbc:oracle:thin:@//db:1521/FREEPDB1
      DB_USERNAME: ${APP_USER}
      DB_PASSWORD: ${APP_USER_PASSWORD}
      APP_JWT_SECRET: ${APP_JWT_SECRET}
      APP_BOOTSTRAP_ADMIN_PHONE: ${APP_BOOTSTRAP_ADMIN_PHONE}
      APP_BOOTSTRAP_ADMIN_PASSWORD: ${APP_BOOTSTRAP_ADMIN_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

networks:
  granaamiga-network:

volumes:
  oracle-data:
