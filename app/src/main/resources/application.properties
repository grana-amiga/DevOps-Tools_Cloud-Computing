spring.application.name=citizentech-api

# Conexão com o banco: SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME e
# SPRING_DATASOURCE_PASSWORD vêm de variáveis de ambiente (Compose + .env).
# Porta: SERVER_PORT (padrão 8080).

# O Hibernate cria/atualiza as tabelas usuario e transacao na subida
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
