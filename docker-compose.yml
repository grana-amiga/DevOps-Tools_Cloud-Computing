# Nome fixo do projeto: volume e rede viram granaamiga_* em qualquer pasta/máquina
name: granaamiga

services:

  db:
    container_name: db
    image: postgres:16
    expose:
      - "5432" # Sem "ports": o banco só é acessível por containers na mesma rede
    networks:
      - granaamiga-network
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    # Valores lidos do .env (o Compose carrega o .env da pasta automaticamente)
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 20s
      retries: 10

  app:
    container_name: app
    build:
      context: ./app
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT:-8080}:8080"
    networks:
      - granaamiga-network
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

networks:
  granaamiga-network:

volumes:
  postgres-data:
